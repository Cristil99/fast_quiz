<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>本地題庫批量輸入器（批次設定 + JSON 可編輯）</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        h1 {
            margin: 12px 16px;
            font-size: 20px;
        }

        .container {
            display: flex;
            gap: 16px;
            padding: 0 16px 16px;
            box-sizing: border-box;
        }

        .left,
        .right {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .left {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row>div {
            flex: 1;
        }

        .buttons {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        /* 多選下拉的展開/收合按鈕（縮小一點） */
        .dropdown-toggle {
            margin: 4px 0;
            padding: 4px 8px;
            font-size: 12px;
            background: #e9ecef;
            color: #333;
        }

        /* 多選 select 展開時的最大高度（避免太長） */
        select[multiple] {
            max-height: 180px;
        }

        button.primary {
            background: #007bff;
            color: #fff;
        }

        button.secondary {
            background: #6c757d;
            color: #fff;
        }

        button.danger {
            background: #dc3545;
            color: #fff;
        }

        /* JSON 編輯區 */
        #jsonPreview {
            flex: 1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 12px;
            background: #111;
            color: #eee;
            padding: 8px;
            border-radius: 4px;
            border: none;
            margin-top: 4px;
            resize: none;
            min-height: 240px;
        }

        .status {
            font-size: 12px;
            margin-top: 6px;
            color: #555;
        }

        .hint {
            margin-top: 4px;
            font-size: 12px;
            color: #777;
        }

        .separator {
            margin: 10px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <h1>本地題庫批量輸入器（批次設定 + JSON 編輯）</h1>

    <div class="container">
        <!-- ◀ 左側：批次設定 + 題目輸入 ------------------------------------------------------------ -->
        <div class="left">

            <!-- 批次共同 meta -->
            <div class="row">
                <div>
                    <label for="batchYear">本批・年分 year</label>
                    <input type="number" id="batchYear" placeholder="例如：109">
                </div>
                <div>
                    <label for="batchSource">本批・來源 source</label>
                    <input type="text" id="batchSource" placeholder="例：109年建築師考試">
                </div>
                <div>
                    <label for="baseId">本批・第一題 ID（可留空）</label>
                    <input type="number" id="baseId" placeholder="例：109001">
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="batchSubject">本批・科目 subject（自由輸入）</label>
                    <input type="text" id="batchSubject" placeholder="例：建築法 / 構造 / 技術規則…">
                </div>
                <div>
                    <label for="batchTopicSelect">本批・Topic（可複選）</label>
                    <button type="button" class="dropdown-toggle" onclick="toggleSelect('batchTopicSelect')">
                        選擇 / 收合 Topic
                    </button>
                    <select id="batchTopicSelect" multiple style="width:100%; display:none;">
                        <!-- 由 JS initTopicTagSelects() 自動填入各 Topic -->
                    </select>
                </div>
            </div>

            <label for="batchTagSelect">本批・Tags（依 Topic 顯示，可複選）</label>
            <button type="button" class="dropdown-toggle" onclick="toggleSelect('batchTagSelect')">
                選擇 / 收合 Tags
            </button>
            <select id="batchTagSelect" multiple style="width:100%; display:none;">
                <!-- 由 JS rebuildTagOptions() 依 Topic 自動更新 -->
            </select>

            <!-- 題目 + 答案 -->
            <label for="batchQuestions">題目區（多題，題與題之間空一行）</label>
            <textarea id="batchQuestions" rows="10"></textarea>

            <label for="batchAnswers">答案區（每行一個 A/B/C/D）</label>
            <textarea id="batchAnswers" rows="5"></textarea>

            <div class="buttons">
                <button class="primary" onclick="batchParseAndAdd()">批量解析並加入題庫 →</button>
                <button class="secondary" onclick="clearInputs()">清空本批輸入</button>
            </div>

            <div class="status" id="statusMsg"></div>

        </div>

        <!-- ▶ 右側：JSON 顯示 / 可編輯 / 套用 + 依題號批次設定 ---------------------------------------- -->
        <div class="right">
            <label for="jsonPreview">目前題庫（可直接編輯 JSON）</label>
            <textarea id="jsonPreview"></textarea>

            <div class="buttons">
                <button class="secondary" onclick="commitJSON()">套用 JSON 修改</button>
                <button class="primary" onclick="downloadJSON()">下載 JSON</button>
                <button class="danger" onclick="clearBank()">清空題庫</button>
            </div>

            <hr class="separator">

            <!-- 依題號批次設定 Topic / Tags -->
            <label for="qnoBatchInput">依題號批次設定 Subject / Topic / Tags</label>
            <div class="hint">題號列表（逗號分隔，可用區間）。例如：<br>1,3,24-25</div>
            <input type="text" id="qnoBatchInput" placeholder="例如：1,3,24-25">
            
            <label for="qnoBatchSubjectSelect">科目 subject</label>
            <button type="button" class="dropdown-toggle" onclick="toggleSelect('qnoBatchSubjectSelect')">
                選擇 / 收合 Subject
            </button>
            <select id="qnoBatchSubjectSelect" style="width:100%; display:none;">
                <!-- 由 JS initTopicTagSelects() 自動填入科目 -->
            </select>
            
            <label for="qnoBatchTopicSelect">Topic（可複選）</label>
            <button type="button" class="dropdown-toggle" onclick="toggleSelect('qnoBatchTopicSelect')">
                選擇 / 收合 Topic
            </button>
            <select id="qnoBatchTopicSelect" multiple style="width:100%; display:none;">
                <!-- 由 JS rebuildQnoTopicOptions() 依 subject 自動更新 -->
            </select>
            
            <label for="qnoBatchTagSelect">Tags（可複選）</label>
            <button type="button" class="dropdown-toggle" onclick="toggleSelect('qnoBatchTagSelect')">
                選擇 / 收合 Tags
            </button>
            <select id="qnoBatchTagSelect" multiple style="width:100%; display:none;">
                <!-- 由 JS rebuildTagOptions() 依 Topic 自動更新 -->
            </select>
            
            <div class="buttons">
                <button class="secondary" onclick="applyTopicTagsByQno()">
                    依題號套用 Subject/Topic/Tags
                </button>
                <button class="secondary" onclick="clearQnoBatchFilters()">
                    一鍵清空目前狀態
                </button>
            </div>
    </div>

    <script>
        let questionBank = [];
        const FIXED_TAGS_BY_TOPIC = {
            // 建築構造與施工
            "結構體": ["基礎工程", "混凝土構造", "鋼構造與 SRC", "其他結構（磚、木、擋土)"],
            "內外裝修": ["建築外殼工程", "屋頂、防水、隔熱、門窗", "內部裝修", "綠建築與綠建材"],
            "營建管理": [],   // 目前沒有細分 tag，就留空或之後再補

            // 營建法規與實務
            "建築法系": ["建築法", "建築師法", "室內裝修管理辦法", "公共安全", "公寓大廈"],
            "技術規則": ["無障礙", "一般設計通則", "技規(1~16)", "地下建築物", "綠建築"],
            "營業法系": ["採購法", "營造業法"],
            "土地法系": ["國土計畫", "區域計畫", "都市計畫", "非都市土地／變使辦法"],

            // 建築環境控制
            "環境": ["光環境", "熱環境", "空氣環境", "聲音環境"],
            "綠建築": ["綠建築", "基地保水", "日常節指標"],
            "設備": ["給排水/衛生設備", "空調設備", "電梯、電器、無障礙", "消防"],
            "特殊": ["綠建材", "智慧建築"]
        };

        // 各科目對應的 Topic
        const SUBJECT_TOPICS = {
            "建築構造與施工": ["結構體", "內外裝修", "營建管理"],
            "營建法規與實務": ["建築法系", "技術規則", "營業法系", "土地法系"],
            "建築環境控制": ["環境", "綠建築", "設備", "特殊"]
        };

        function getSelectedValues(selectId) {
            const sel = document.getElementById(selectId);
            if (!sel) return [];
            return Array.from(sel.options)
                .filter(opt => opt.selected && opt.value)
                .map(opt => opt.value);
        }

        // 切換多選 select 的顯示 / 隱藏
        function toggleSelect(selectId) {
            const sel = document.getElementById(selectId);
            if (!sel) return;
            if (sel.style.display === "none" || sel.style.display === "") {
                sel.style.display = "block";
            } else {
                sel.style.display = "none";
            }
        }

        function rebuildTagOptions(topicSelectId, tagSelectId) {
            const topics = getSelectedValues(topicSelectId);
            const tagSel = document.getElementById(tagSelectId);
            if (!tagSel) return;

            tagSel.innerHTML = "";

            const tagSet = new Set();

            // 一律先放一個「無」選項
            tagSet.add("無");

            // 如果 topic 有選「無」，就代表不要展開其他 tag
            if (!topics.includes("無")) {
                topics.forEach(t => {
                    const tags = FIXED_TAGS_BY_TOPIC[t] || [];
                    tags.forEach(tag => tagSet.add(tag));
                });
            }

            Array.from(tagSet).forEach(tag => {
                const op = document.createElement("option");
                op.value = tag;
                op.textContent = tag;
                tagSel.appendChild(op);
            });
        }

        // 右側：依科目重建 Topic 選單（並清空 Tags）
        function rebuildQnoTopicOptions() {
            const subjectSel = document.getElementById("qnoBatchSubjectSelect");
            const topicSel = document.getElementById("qnoBatchTopicSelect");
            const tagSel = document.getElementById("qnoBatchTagSelect");
            if (!subjectSel || !topicSel || !tagSel) return;

            const subject = subjectSel.value;
            const topics = SUBJECT_TOPICS[subject] || [];

            // 清空 topic / tag
            topicSel.innerHTML = "";
            tagSel.innerHTML = "";

            // 先加一個「無」
            const noneOp = document.createElement("option");
            noneOp.value = "無";
            noneOp.textContent = "無";
            topicSel.appendChild(noneOp);

            // 再加科目對應的 topics
            topics.forEach(t => {
                const op = document.createElement("option");
                op.value = t;
                op.textContent = t;
                topicSel.appendChild(op);
            });

            // 先不預設選任何 Topic，讓使用者自己勾選
            // Tags 會在選 Topic 時由 rebuildTagOptions() 自動重建
        }

        function initTopicTagSelects() {
            const batchTopicSelect = document.getElementById("batchTopicSelect");
            const qnoTopicSelect = document.getElementById("qnoBatchTopicSelect");
            const qnoSubjectSelect = document.getElementById("qnoBatchSubjectSelect");

            const allTopics = ["無", ...Object.keys(FIXED_TAGS_BY_TOPIC)];

            // 左側批次：直接列出所有 Topic
            if (batchTopicSelect) {
                allTopics.forEach(t => {
                    const op = document.createElement("option");
                    op.value = t;
                    op.textContent = t;
                    batchTopicSelect.appendChild(op);
                });
            }

            // 右側：先建立科目選單，再依科目建立 Topic
            if (qnoSubjectSelect) {
                const subjectKeys = Object.keys(SUBJECT_TOPICS);
                subjectKeys.forEach(sub => {
                    const op = document.createElement("option");
                    op.value = sub;
                    op.textContent = sub;
                    qnoSubjectSelect.appendChild(op);
                });

                qnoSubjectSelect.addEventListener("change", () => {
                    rebuildQnoTopicOptions();
                });

                // 預設選第一個科目並建立 Topic
                if (subjectKeys.length > 0) {
                    qnoSubjectSelect.value = subjectKeys[0];
                    rebuildQnoTopicOptions();
                }
            }

            // 左側 topic 改變 → 重建左側 tags
            if (batchTopicSelect) {
                batchTopicSelect.addEventListener("change", () => {
                    rebuildTagOptions("batchTopicSelect", "batchTagSelect");
                });
            }

            // 右側 topic 改變 → 重建右側 tags
            if (qnoTopicSelect) {
                qnoTopicSelect.addEventListener("change", () => {
                    rebuildTagOptions("qnoBatchTopicSelect", "qnoBatchTagSelect");
                });
            }

            // 初始化左側 tags（右側 tags 由 rebuildQnoTopicOptions + change 控制）
            rebuildTagOptions("batchTopicSelect", "batchTagSelect");
        }

        /* 工具：確保 topic / tags 格式正確 */
        function normalizeQuestion(q) {
            const nq = { ...q };

            // topic 一律變成陣列
            if (Array.isArray(nq.topic)) {
                nq.topic = nq.topic
                    .map(t => (typeof t === "string" ? t.trim() : ""))
                    .filter(t => t.length > 0);
            } else if (typeof nq.topic === "string" && nq.topic.trim().length > 0) {
                nq.topic = [nq.topic.trim()];
            } else {
                nq.topic = [];
            }

            // tags 也確保是陣列
            if (Array.isArray(nq.tags)) {
                nq.tags = nq.tags
                    .map(t => (typeof t === "string" ? t.trim() : ""))
                    .filter(t => t.length > 0);
            } else if (typeof nq.tags === "string" && nq.tags.trim().length > 0) {
                nq.tags = [nq.tags.trim()];
            } else {
                nq.tags = [];
            }

            return nq;
        }

        /* 更新右側 JSON 區 */
        function updatePreview() {
            const ta = document.getElementById("jsonPreview");
            ta.value = JSON.stringify({ questions: questionBank }, null, 2);
        }

        function setStatus(msg) {
            document.getElementById("statusMsg").textContent = msg;
        }

        function clearInputs() {
            document.getElementById("batchQuestions").value = "";
            document.getElementById("batchAnswers").value = "";
            setStatus("本批題目與答案已清空。");
        }

        function clearBank() {
            if (!confirm("確定清空整個題庫？")) return;
            questionBank = [];
            updatePreview();
            setStatus("題庫已清空。");
        }

        /* 取得本批設定 */
        function getBatchMeta() {
            const year = document.getElementById("batchYear").value.trim();
            const source = document.getElementById("batchSource").value.trim();
            const baseId = document.getElementById("baseId").value.trim();

            const subject = document.getElementById("batchSubject").value.trim();
            const subtopicEl = document.getElementById("batchSubtopic");
            const subtopic = subtopicEl ? subtopicEl.value.trim() : "";

            let topics = getSelectedValues("batchTopicSelect");
            let tags = getSelectedValues("batchTagSelect");

            // 🔹重點：如果選到「無」，就代表這批不要寫任何 topic / tags（空陣列）
            if (topics.includes("無")) {
                topics = [];
            }
            if (tags.includes("無")) {
                tags = [];
            }

            const y = year ? Number(year) : null;
            const bId = baseId ? Number(baseId) : null;

            return {
                year: y,
                source: source || null,
                baseId: bId,
                subject: subject || null,
                topic: topics,
                subtopic: subtopic || null,
                tags
            };
        }

        /* 解析單題 */
        function parseOne(raw, ans, meta, index) {
            let text = raw.trim();
            if (!text) return { obj: null, error: "空白題目" };

            const normalized = text.replace(/\s+/g, " ");

            const parts = normalized.split(/|||/);
            if (parts.length < 5) return { obj: null, error: "缺少四個選項符號" };

            let stem = parts[0].trim();
            let year = meta.year;
            let qno = null;

            // 自動抓三位數年份（如果批次沒指定）
            if (!year) {
                const mYear = stem.match(/^(\d{3})\b/);
                if (mYear) {
                    year = Number(mYear[1]);
                    stem = stem.replace(/^(\d{3})\s*/, "");
                }
            }

            // 抓題號（例如「1 下列…」）
            const mQno = stem.match(/^(\d+)\b/);
            if (mQno) {
                qno = Number(mQno[1]);
                stem = stem.replace(/^\d+\s*/, "");
            }

            const A = parts[1].trim();
            const B = parts[2].trim();
            const C = parts[3].trim();
            const D = parts[4].trim();

            if (!A || !B || !C || !D) return { obj: null, error: "A~D 有空白" };

            let id = null;
            if (meta.baseId != null) id = meta.baseId + index;

            const baseTopic = Array.isArray(meta.topic)
                ? meta.topic.slice()
                : (typeof meta.topic === "string" && meta.topic.trim()
                    ? [meta.topic.trim()]
                    : []);

            const baseTags = Array.isArray(meta.tags) ? meta.tags.slice() : [];

            const qObj = {
                id,
                qno, // 題號（之後可用來批次設定 Topic/Tags）
                question: stem,
                options: { A, B, C, D },
                answer: ans,
                explanation: "",
                subject: meta.subject || "",
                topic: baseTopic,
                subtopic: meta.subtopic || "",
                source: meta.source || "",
                year,
                tags: baseTags
            };

            return {
                obj: normalizeQuestion(qObj),
                error: null
            };
        }

        /* 批量解析 ＋ 插入題庫 */
        function batchParseAndAdd() {
            const qs = document.getElementById("batchQuestions").value.trim();
            const as = document.getElementById("batchAnswers").value.trim();

            if (!qs || !as) {
                setStatus("題目區或答案區為空");
                return;
            }

            const meta = getBatchMeta();
            const qBlocks = qs.split(/\n\s*\n+/).map(t => t.trim()).filter(t => t);
            const aLines = as.split(/\n+/).map(t => t.trim()).filter(t => t);

            if (qBlocks.length !== aLines.length) {
                setStatus(`題目(${qBlocks.length}) vs 答案(${aLines.length}) 不一致`);
                return;
            }

            let success = 0;
            let failed = [];

            for (let i = 0; i < qBlocks.length; i++) {
                const ans = (aLines[i].match(/[A-D]/i) || [""])[0].toUpperCase();
                if (!ans) { failed.push(i + 1); continue; }

                const { obj, error } = parseOne(qBlocks[i], ans, meta, i);
                if (error || !obj) { failed.push(i + 1); continue; }

                /* ★★★ 新題目插到最前面 ★★★ */
                questionBank.unshift(obj);

                success++;
            }

            updatePreview();

            if (failed.length === 0)
                setStatus(`成功加入 ${success} 題`);
            else
                setStatus(`加入 ${success} 題；失敗：${failed.join(", ")}`);
        }

        /* 套用右側 JSON 修改 */
        function commitJSON() {
            const ta = document.getElementById("jsonPreview");
            try {
                const obj = JSON.parse(ta.value.trim());
                if (!obj.questions || !Array.isArray(obj.questions)) {
                    setStatus("JSON 應為 {\"questions\": [...]} 格式");
                    return;
                }
                // 讀入時順便把 topic/tags 正規化
                questionBank = obj.questions.map(q => normalizeQuestion(q));
                updatePreview();
                setStatus("已套用 JSON 修改（並正規化 topic/tags）");
            } catch (e) {
                setStatus("JSON 格式錯誤：" + e.message);
            }
        }

        /* 下載 JSON */
        function downloadJSON() {
            const blob = new Blob(
                [JSON.stringify({ questions: questionBank }, null, 2)],
                { type: "application/json" }
            );
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "question_bank.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        /* 將 "1,3,24-25" 解析成 [1,3,24,25] */
        function parseQnoList(str) {
            const tokens = str.split(",")
                .map(s => s.trim())
                .filter(s => s.length > 0);

            const result = [];

            tokens.forEach(tok => {
                const mRange = tok.match(/^(\d+)\s*-\s*(\d+)$/);
                if (mRange) {
                    let start = Number(mRange[1]);
                    let end = Number(mRange[2]);
                    if (!Number.isNaN(start) && !Number.isNaN(end)) {
                        if (start > end) {
                            const tmp = start;
                            start = end;
                            end = tmp;
                        }
                        for (let n = start; n <= end; n++) {
                            result.push(n);
                        }
                    }
                } else {
                    const n = Number(tok);
                    if (!Number.isNaN(n)) {
                        result.push(n);
                    }
                }
            });

            return result;
        }

        /* 依題號批次套用 Topic / Tags */
        function applyTopicTagsByQno() {
            const rawQnos = document.getElementById("qnoBatchInput").value.trim();

            if (!rawQnos) {
                setStatus("請先輸入題號列表。");
                return;
            }

            const qnos = parseQnoList(rawQnos);
            if (qnos.length === 0) {
                setStatus("題號解析後為空，請確認格式（如：1,3,24-25）。");
                return;
            }

            const subjectSel = document.getElementById("qnoBatchSubjectSelect");
            const subjectToApply = subjectSel && subjectSel.value.trim() ? subjectSel.value.trim() : null;

            let topicsToApply = getSelectedValues("qnoBatchTopicSelect");
            let tagsToApply = getSelectedValues("qnoBatchTagSelect");

            // 若選到「無」，表示要清空原有的 topic / tags
            const clearTopics = topicsToApply.includes("無");
            const clearTags = tagsToApply.includes("無");

            // 既然要清空，就不需要其他選項了
            if (clearTopics) topicsToApply = [];
            if (clearTags) tagsToApply = [];

            // 有任一動作（設 subject / 清空 / 新增 topic / 新增 tag）才算有效
            const hasAction =
                !!subjectToApply ||
                clearTopics || clearTags ||
                topicsToApply.length > 0 ||
                tagsToApply.length > 0;

            if (!hasAction) {
                setStatus("請至少選擇 Subject、Topic 或 Tags 之一。");
                return;
            }

            const qnoSet = new Set(qnos);
            let count = 0;

            questionBank = questionBank.map(q => {
                if (!q || typeof q.qno !== "number" || !qnoSet.has(q.qno)) {
                    return q;
                }

                const nq = normalizeQuestion(q);

                // 套用 subject（直接覆蓋）
                if (subjectToApply) {
                    nq.subject = subjectToApply;
                }

                // Topic：若 clearTopics 為 true → 清空；否則照原規則合併
                if (clearTopics) {
                    nq.topic = [];
                } else if (topicsToApply.length > 0) {
                    const mergedTopics = [...nq.topic, ...topicsToApply];
                    nq.topic = Array.from(new Set(
                        mergedTopics.map(t => (typeof t === "string" ? t.trim() : ""))
                            .filter(t => t.length > 0)
                    ));
                }

                // Tags：若 clearTags 為 true → 清空；否則照原規則合併
                if (clearTags) {
                    nq.tags = [];
                } else if (tagsToApply.length > 0) {
                    const mergedTags = [...nq.tags, ...tagsToApply];
                    nq.tags = Array.from(new Set(
                        mergedTags.map(t => (typeof t === "string" ? t.trim() : ""))
                            .filter(t => t.length > 0)
                    ));
                }

                count++;
                return nq;
            });

            updatePreview();
            setStatus(`已對 ${count} 題套用 Subject/Topic/Tags（題號：${qnos.join(", ")}）`);
        }

        // 一鍵清空「依題號批次設定」區域的輸入與選擇
        function clearQnoBatchFilters() {
            const qnoInput = document.getElementById("qnoBatchInput");
            if (qnoInput) {
                qnoInput.value = "";
            }

            const subjectSel = document.getElementById("qnoBatchSubjectSelect");
            const topicSel = document.getElementById("qnoBatchTopicSelect");
            const tagSel = document.getElementById("qnoBatchTagSelect");

            // 重設科目為第一個選項
            if (subjectSel && subjectSel.options.length > 0) {
                subjectSel.selectedIndex = 0;
            }

            // 清空 Topic / Tags，再依目前科目重建
            if (topicSel) {
                topicSel.innerHTML = "";
            }
            if (tagSel) {
                tagSel.innerHTML = "";
            }

            // 重新依科目建立 Topic & Tags（若有這個函式）
            if (typeof rebuildQnoTopicOptions === "function") {
                rebuildQnoTopicOptions();
            }

            setStatus("已清空題號與 Subject / Topic / Tags 的目前狀態。");
        }


        /* 初始化 */
        initTopicTagSelects();
        updatePreview();
    </script>

</body>
