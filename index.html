<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建築法 刷題測試</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f2f2f2;
        }

        .card {
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
        }

        .question-meta {
            font-size: 14px;
            color: #777;
            margin-bottom: 4px;
        }

        .explanation {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        .option {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            background: #e9e9e9;
            cursor: pointer;
        }

        .option.correct {
            background: #c8f7c5;
        }

        .option.wrong {
            background: #f8c5c5;
        }

        button {
            margin-top: 10px;
            padding: 12px 22px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #nextBtn {
            background: #4CAF50;
            color: white;
        }

        #restartBtn {
            background: #2196F3;
            color: white;
        }

        #shuffleBtn {
            background: #FF9800;
            color: white;
        }

        button:disabled {
            background: #bbb;
        }

        #status {
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>
    <h2>建築法 - 測試版刷題</h2>

    <div class="card" style="margin-bottom:20px;">
        <h3>開始前設定</h3>

        <!-- 年份（year） -->
        <label>選擇年份：</label>
        <select id="yearSelect">
            <option value="all">全部年份</option>
        </select>
        <br><br>

        <!-- 科目（subject） -->
        <label>選擇科目（subject）：</label>
        <select id="subjectSelect">
            <option value="all">全部科目</option>
        </select>
        <br><br>

        <!-- 大類別（topic） -->
        <label>選擇大類別（topic）：</label>
        <select id="topicSelect">
            <option value="all">全部大類別</option>
        </select>
        <br><br>

        <label>選擇題目數量：</label>
        <select id="questionCount">
            <option value="5">5 題</option>
            <option value="10">10 題</option>
            <option value="20">20 題</option>
            <option value="all">全部題目</option>
        </select>
        <br><br>

        <!-- 刷題模式 -->
        <label>刷題模式：</label>
        <select id="modeSelect">
            <option value="bank">使用題庫刷題</option>
            <option value="wrong-only">只刷錯題</option>
            <option value="generate">生成試題（預留）</option>
        </select>
        <br><br>

        <button id="startBtn" style="background:#4CAF50;color:white;padding:10px 20px;border-radius:8px;">
            開始刷題
        </button>
    </div>

    <div id="status">載入題庫中...</div>

    <div id="quiz-container"></div>

    <button id="nextBtn" disabled>下一題 →</button>
    <button id="restartBtn">⟳ 重頭開始</button>
    <button id="shuffleBtn">🔀 亂序題目</button>

    <script>
        // 題庫資料
        let fullQuestionBank = [];   // 所有題目
        let questions = [];          // 本次要刷的題目
        let current = 0;

        // 計分 + 錯題
        let score = 0;
        let wrongQuestions = [];
        let hasAnswered = false;

        // DOM
        const quizContainer = document.getElementById("quiz-container");
        const nextBtn = document.getElementById("nextBtn");
        const restartBtn = document.getElementById("restartBtn");
        const shuffleBtn = document.getElementById("shuffleBtn");
        const statusDiv = document.getElementById("status");
        const yearSelect = document.getElementById("yearSelect");
        const subjectSelect = document.getElementById("subjectSelect");
        const topicSelect = document.getElementById("topicSelect");
        const modeSelect = document.getElementById("modeSelect");

        // ✅ 題庫檔案清單（之後有新的年份 / 科目在這裡加）
        const questionFiles = [
            "questions/112_法規.json",
            "questions/112_構造.json",
            "questions/113_法規.json",
            "questions/113_物環.json",
            "questions/113_構造.json",
        ];

        // 讀取多個 JSON 題庫並合併
        async function loadQuestionsFromJson() {
            try {
                let allQuestions = [];

                for (const file of questionFiles) {
                    const res = await fetch(file);
                    if (!res.ok) {
                        console.warn("載入失敗：", file, res.status);
                        continue;
                    }

                    const data = await res.json();

                    if (Array.isArray(data.questions)) {
                        allQuestions = allQuestions.concat(data.questions);
                    } else if (Array.isArray(data)) {
                        allQuestions = allQuestions.concat(data);
                    } else {
                        console.warn("未知的 JSON 結構：", file, data);
                    }
                }

                fullQuestionBank = allQuestions;

                if (!fullQuestionBank || fullQuestionBank.length === 0) {
                    statusDiv.textContent = "題庫是空的，請確認 questions 資料夾中的 JSON 檔案。";
                    return;
                }

                buildYearOptions();
                statusDiv.textContent = `題庫載入成功，共 ${fullQuestionBank.length} 題。`;
            } catch (err) {
                console.error(err);
                statusDiv.textContent = "載入題庫失敗。";
            }
        }

        // 建立年份選單
        function buildYearOptions() {
            yearSelect.innerHTML = "";
            const optAll = document.createElement("option");
            optAll.value = "all";
            optAll.textContent = "全部年份";
            yearSelect.appendChild(optAll);

            const yearSet = new Set();
            fullQuestionBank.forEach(q => {
                if (q.year !== undefined && q.year !== null) {
                    yearSet.add(String(q.year));
                }
            });

            Array.from(yearSet).sort((a, b) => Number(a) - Number(b)).forEach(y => {
                const opt = document.createElement("option");
                opt.value = y;
                opt.textContent = `${y} 年`;
                yearSelect.appendChild(opt);
            });

            yearSelect.addEventListener("change", updateSubjectOptions);
            updateSubjectOptions();
        }

        // 根據年份更新科目選單
        function updateSubjectOptions() {
            const selectedYear = yearSelect.value;

            subjectSelect.innerHTML = "";
            const optAll = document.createElement("option");
            optAll.value = "all";
            optAll.textContent = "全部科目";
            subjectSelect.appendChild(optAll);

            const subjectSet = new Set();
            fullQuestionBank.forEach(q => {
                const matchYear = (selectedYear === "all") || (String(q.year) === selectedYear);
                if (matchYear && q.subject) {
                    subjectSet.add(q.subject);
                }
            });

            subjectSet.forEach(sub => {
                const opt = document.createElement("option");
                opt.value = sub;
                opt.textContent = sub;
                subjectSelect.appendChild(opt);
            });

            subjectSelect.addEventListener("change", updateTopicOptions);
            updateTopicOptions();
        }

        // 根據年份 + 科目更新大類別(topic)選單
        function updateTopicOptions() {
            const selectedYear = yearSelect.value;
            const selectedSubject = subjectSelect.value;

            topicSelect.innerHTML = "";
            const optAll = document.createElement("option");
            optAll.value = "all";
            optAll.textContent = "全部大類別";
            topicSelect.appendChild(optAll);

            const topicSet = new Set();
            fullQuestionBank.forEach(q => {
                const matchYear = (selectedYear === "all") || (String(q.year) === selectedYear);
                const matchSubject = (selectedSubject === "all") || (q.subject === selectedSubject);
                if (!matchYear || !matchSubject) return;

                if (Array.isArray(q.topic)) {
                    q.topic.forEach(t => {
                        if (t) topicSet.add(t);
                    });
                } else if (q.topic) {
                    topicSet.add(q.topic);
                }
            });

            topicSet.forEach(tp => {
                const opt = document.createElement("option");
                opt.value = tp;
                opt.textContent = tp;
                topicSelect.appendChild(opt);
            });
        }

        function resetState() {
            current = 0;
            score = 0;
            wrongQuestions = [];
            hasAnswered = false;
            nextBtn.disabled = true;
            nextBtn.style.display = "inline-block";
            statusDiv.textContent = `已載入題庫，共 ${questions.length} 題。第 1 題｜目前得分：0`;
        }

        // 篩選題目：依年份 + 科目 + topic + 題數
        function prepareQuestions() {
            const selectedYear = yearSelect.value;
            const selectedSubject = subjectSelect.value;
            const selectedTopic = topicSelect.value;
            const questionCount = document.getElementById("questionCount").value;

            questions = fullQuestionBank.filter(q => {
                const matchYear = (selectedYear === "all") || (String(q.year) === selectedYear);
                const matchSubject = (selectedSubject === "all") || (q.subject === selectedSubject);
                let matchTopic = true;
                if (selectedTopic !== "all") {
                    if (Array.isArray(q.topic)) {
                        matchTopic = q.topic.includes(selectedTopic);
                    } else {
                        matchTopic = (q.topic === selectedTopic);
                    }
                }
                return matchYear && matchSubject && matchTopic;
            });

            if (questions.length === 0) {
                alert("沒有符合這個條件的題目！");
                return false;
            }

            // 亂序
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }

            if (questionCount !== "all") {
                questions = questions.slice(0, Number(questionCount));
            }

            return true;
        }

        // 顯示題目
        function loadQuestion() {
            nextBtn.disabled = true;
            hasAnswered = false;
            quizContainer.innerHTML = "";

            const q = questions[current];

            // 題目前綴：例如「113建築構造與施工第32題」
            let metaParts = [];
            if (q.year !== undefined && q.year !== null) metaParts.push(String(q.year));
            if (q.subject) metaParts.push(q.subject);
            if (q.qno !== undefined && q.qno !== null) metaParts.push(`第${q.qno}題`);
            const metaText = metaParts.join("") || `第 ${current + 1} 題`;

            const explanationText = q.explanation && q.explanation.trim().length > 0
                ? q.explanation
                : "（尚無解釋，之後可在 JSON 裡補上 explanation。）";

            let html = `
            <div class="card">
                <div class="question-meta">${metaText}</div>
                <div class="question">${q.question}</div>
                <div class="option" data-opt="A">A. ${q.options.A}</div>
                <div class="option" data-opt="B">B. ${q.options.B}</div>
                <div class="option" data-opt="C">C. ${q.options.C}</div>
                <div class="option" data-opt="D">D. ${q.options.D}</div>
                <div class="explanation" id="explanation" style="display:none;">
                    <strong>解釋：</strong><span>${explanationText}</span>
                </div>
            </div>
            `;

            quizContainer.innerHTML = html;

            document.querySelectorAll(".option").forEach(opt => {
                opt.addEventListener("click", () => handleAnswer(opt, q));
            });

            statusDiv.textContent = `第 ${current + 1} / ${questions.length} 題｜目前得分：${score}`;
        }

        // 判斷答案 + 記錄錯題
        function handleAnswer(optionDiv, questionObj) {
            if (hasAnswered) return;
            hasAnswered = true;

            const correctAnswer = questionObj.answer;
            const userAns = optionDiv.dataset.opt;

            if (userAns === correctAnswer) {
                optionDiv.classList.add("correct");
                score++;
            } else {
                optionDiv.classList.add("wrong");

                const correctDiv = document.querySelector(`[data-opt="${correctAnswer}"]`);
                if (correctDiv) {
                    correctDiv.classList.add("correct");
                }

                // 記錄錯題（保留完整題目物件 + 使用者答案）
                wrongQuestions.push({
                    ...questionObj,
                    correctAnswer: correctAnswer,
                    userAnswer: userAns
                });
            }

            // 顯示解釋
            const expDiv = document.getElementById("explanation");
            if (expDiv) expDiv.style.display = "block";

            document.querySelectorAll(".option").forEach(opt => opt.style.pointerEvents = "none");
            nextBtn.disabled = false;

            statusDiv.textContent = `第 ${current + 1} / ${questions.length} 題｜目前得分：${score}`;
        }

        // 下一題
        nextBtn.addEventListener("click", () => {
            current++;
            if (current < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        // 顯示結果 + 錯題回顧
        function showResult() {
            let html = `
                <h2>🎉 已完成全部題目！</h2>
                <p>得分：${score} / ${questions.length}</p>
            `;

            if (wrongQuestions.length === 0) {
                html += `<p>全部答對！太強了 💪</p>`;
            } else {
                html += `<h3>錯題回顧（共 ${wrongQuestions.length} 題）</h3>`;
                wrongQuestions.forEach((w, idx) => {
                    const label = (w.year ? w.year : "") + (w.subject ? w.subject : "") +
                        (w.qno ? `第${w.qno}題` : "");
                    html += `
                    <div class="card">
                        <div class="question">${label || (idx + 1)}. ${w.question}</div>
                        <p>你的答案：${w.userAnswer}. ${w.options[w.userAnswer]}</p>
                        <p>正確答案：${w.correctAnswer}. ${w.options[w.correctAnswer]}</p>
                    </div>
                    `;
                });
            }

            quizContainer.innerHTML = html;
            nextBtn.disabled = true;
            nextBtn.style.display = "none";
            statusDiv.textContent = `測驗完成｜最終得分：${score} / ${questions.length}`;
        }

        // ⟳ 重頭開始（保留目前排序）
        restartBtn.addEventListener("click", () => {
            resetState();
            loadQuestion();
        });

        // 🔀 亂序題目
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffleBtn.addEventListener("click", () => {
            shuffleArray(questions);
            resetState();
            loadQuestion();
            statusDiv.textContent = `題目已亂序排列｜第 1 題｜目前得分：${score}`;
        });

        // 開始刷題按鈕
        document.getElementById("startBtn").addEventListener("click", () => {
            const mode = modeSelect.value;
            const questionCount = document.getElementById("questionCount").value;

            // 生成式題目模式（預留）
            if (mode === "generate") {
                alert("『生成式題目』功能尚未實作（預留）。");
                return;
            }

            // 只刷錯題模式
            if (mode === "wrong-only") {
                if (wrongQuestions.length === 0) {
                    alert("目前沒有錯題可以刷喔！");
                    return;
                }

                questions = [...wrongQuestions];

                // 亂序
                shuffleArray(questions);

                // 取題數
                if (questionCount !== "all") {
                    questions = questions.slice(0, Number(questionCount));
                }

                current = 0;
                score = 0;
                hasAnswered = false;

                statusDiv.textContent = `開始只刷錯題（共 ${questions.length} 題）`;
                loadQuestion();
                return;
            }

            // 題庫刷題模式（bank）
            const ok = prepareQuestions();
            if (!ok) return;

            current = 0;
            score = 0;
            wrongQuestions = [];
            hasAnswered = false;

            statusDiv.textContent = `開始刷題（共 ${questions.length} 題）`;
            loadQuestion();
        });

        // 初始化載入題庫
        loadQuestionsFromJson();
    </script>

</body>

</html>
